[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "istsos4-client"
version = "0.1.0"
description = "Python client for istSOS4 (OGC SensorThings API)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Centazzo", email = "centazzoda@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/istSOS/istSOS4-client"
Repository = "https://github.com/istSOS/istSOS4-client"
Issues = "https://github.com/istSOS/istSOS4-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/istsos4_client"]